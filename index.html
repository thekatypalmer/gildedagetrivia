<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Gilded Age Trivia</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

        <header>
            <p class="eyebrow">New York Society Awaits</p>
            <h1>The Gilded Age Trivia</h1>
            <p>How well do you know the Russells, the van Rhijns, and New York society?</p>
        </header>

        <section id="difficulty-screen">

            <h2>Choose Your Difficulty</h2>

            <p>How formidable is your knowledge of New York society?</p>

            <div id="difficulty-buttons">

                <button class="difficulty-button" data-difficulty="Easy">
                    Easy
                </button>

                <button class="difficulty-button" data-difficulty="Medium">
                    Medium
                </button>

                <button class="difficulty-button" data-difficulty="Hard">
                    Hard
                </button>

            </div>

        </section>

        <section id="quiz-screen" class="hidden">

            <div class="progress-area">
                <p id="progress-text">Question 1 of 5</p>

                <div class="progress-bar">
                    <div id="progress-fill"></div>
                </div>
            </div>

            <div class="question-card">

                <h2 id="question">
                    Question goes here
                </h2>

                <div id="answer-buttons">
                </div>

                <p id="feedback"></p>

                <button id="next-button" class="next-button">
                    Next Question
                </button>

            </div>

        </section>

        <section id="results-screen" class="hidden">

            <p class="eyebrow">The Results Are In</p>

            <h2>Your Score</h2>

            <p id="final-score"></p>

            <p id="result-message"></p>

            <h3 id="review-heading">Review Your Answers</h3>

            <div id="answer-review"></div>

            <button id="play-again-button">
                Play Again
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
